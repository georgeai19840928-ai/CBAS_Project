name: CBAS Daily Report

on:
  workflow_dispatch:
    inputs:
      no_ai:
        description: "Skip Gemini and send deterministic report"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # 15:10 Asia/Taipei, Monday to Friday. GitHub Actions schedules use UTC.
    - cron: "10 7 * * 1-5"

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run CBAS daily report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.no_ai }}" = "true" ]; then
            python cron_job.py --no-ai
          else
            python cron_job.py
          fi
